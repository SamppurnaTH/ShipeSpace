spring:
  application:
    name: shipspace-mvp
  main:
    # allow-bean-definition-overriding was removed.
    # If you see "Bean definition overriding" errors on startup, find the duplicate
    # @Bean method and remove or qualify it — do NOT re-enable this flag.
    allow-bean-definition-overriding: false

  # MongoDB Configuration with Connection Pooling
  data:
    mongodb:
      # Production URI should include replicaSet and readPreference:
      # mongodb+srv://...?replicaSet=rs0&readPreference=secondaryPreferred&maxPoolSize=50
      # readPreference=secondaryPreferred: reads go to secondaries during primary election,
      # preventing 100% read failure during the ~10s election window (F-01 fix).
      uri: ${MONGODB_URI:mongodb://localhost:27017/shipspace}
      auto-index-creation: false
      database: shipspace
      connection-per-host: 50
      min-connections-per-host: 10
      max-connections-idle-time: 60000
      max-wait-time: 30000

    # Redis Configuration (Spring Boot 3.x uses spring.data.redis)
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 200
        shutdown-timeout: 200ms

  # Cache Configuration (Spring Boot auto-config)
  # Phase 1 fix: spring.cache.redis.time-to-live is the correct property path.
  # The previous value was read via @Value("${spring.cache.redis.time-to-live:300}")
  # in CacheConfig — this is now consistent with Spring Boot's own cache auto-config.
  cache:
    redis:
      time-to-live: 300000  # 300 seconds in milliseconds (Spring Boot expects ms here)

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  http2:
    enabled: true

# JWT Configuration
# F-10 fix: access token TTL reduced from 24h to 15 minutes.
# This limits the replay window if a token is stolen or if Redis is down
# during a blacklist check (fail-open). Refresh tokens remain at 7 days.
# Clients must implement silent refresh using the refresh token.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# GitHub OAuth Configuration
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/callback}
    token-url: https://github.com/login/oauth/access_token
    user-url: https://api.github.com/user

# Multibase Configuration
multibase:
  api-url: ${MULTIBASE_API_URL:http://localhost:5001}
  api-key: ${MULTIBASE_API_KEY:your-multibase-api-key}
  timeout: 30000
  retry:
    max-attempts: 3
    delay: 1000

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type,Accept,X-Requested-With,Cache-Control
  allow-credentials: true
  max-age: 3600
  exposed-headers: X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset

# Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_RPM:60}
  # Per-user rate limiting
  per-user:
    enabled: ${RATE_LIMIT_PER_USER:true}
    requests-per-minute: 120
    burst-capacity: 150

# Ship Edit Window Configuration
ship:
  edit-window-minutes: 10

# Feed Configuration
feed:
  page-size: 20
  trending:
    cache-ttl-minutes: 15
    recalculation-interval-ms: 900000  # 15 minutes
    time-windows:
      - 24h
      - 7d
      - 30d

# Rank Progression Configuration
rank-progression:
  # Score thresholds per level
  score-per-level: 40
  max-level: 30
  # Decay settings
  decay:
    enabled: ${DECAY_ENABLED:true}
    threshold-days: 60
    decay-percentage: 10
    scheduled-cron: "0 0 2 * * *"
  # Daily caps per event type
  daily-caps:
    PROJECT_CREATED: -1 # No limit
    PROJECT_UPDATED: 5
    COLLAB_ACCEPTED: -1 # No limit
    QUALITY_COMMENT: -1 # No limit

# Cache Configuration
cache:
  enabled: ${CACHE_ENABLED:true}
  ttl-seconds: 300
  rank-summary:
    ttl-seconds: 60
  user-profile:
    ttl-seconds: 120

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,loggers
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: mongo,redis,multibase,searchIndex
        liveness:
          include: ping
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: shipspace-mvp
  tracing:
    sampling:
      probability: 0.1   # 10% in production — set to 1.0 only in dev/staging
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      mongodb:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60000
        failureRateThreshold: 50
        recordExceptions:
          - org.springframework.dao.DataAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      redis:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
      github-oauth:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30000
        failureRateThreshold: 60
        recordExceptions:
          - com.shipspace.exception.GitHubOAuthException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      multibase:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 60000
        failureRateThreshold: 50
        recordExceptions:
          - com.shipspace.exception.MultibaseException
          - java.io.IOException
  retry:
    instances:
      mongodb:
        maxAttempts: 3
        waitDuration: 500
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.dao.DataAccessException
          - java.io.IOException
      external-api:
        maxAttempts: 3
        waitDuration: 1000
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      external-api:
        maxConcurrentCalls: 10

# Logging Configuration
logging:
  level:
    root: INFO
    com.shipspace: INFO
    org.springframework.data.mongodb: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/shipspace.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
  logback:
    encoder:
      pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Audit Logging Configuration
audit:
  enabled: ${AUDIT_ENABLED:true}
  events:
    - RANK_CHANGED
    - LEVEL_CHANGED
    - SCORE_APPLIED
    - USER_LOGIN
    - USER_REGISTER
  retention-days: 365

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
  show-actuator: false
  enable-spring-security: true

# Security Configuration
security:
  headers:
    hsts: strict
    content-type-options: nosniff
    xss-protection: 1;mode=block
    frame-options: DENY
    referrer-policy: strict-origin-when-cross-origin
    permissions-policy: accelerometer=(),camera=(),geolocation=(),gyroscope=(),magnetometer=(),microphone=(),payment=(),usb=()
  cors:
    allow-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Load Shedding Configuration
load-shedding:
  enabled: ${LOAD_SHEDDING_ENABLED:true}
  max-concurrent-requests: ${LOAD_SHEDDING_MAX_CONCURRENT:200}
  shed-threshold: ${LOAD_SHEDDING_SHED_THRESHOLD:0.85}

# Demo Mode Configuration
demo:
  mode: ${DEMO_MODE:false}

# SLO Control Loop Configuration
slo:
  # Warm-start cycles after restart (each cycle = 10s evaluation interval).
  # 6 cycles = 60s ramp from 50% to full concurrency.
  # Prevents cold-start overload after crash or rolling restart.
  warm-start-cycles: ${SLO_WARM_START_CYCLES:6}

# Search Configuration
# Slow query threshold in milliseconds. Queries exceeding this emit WARN.
# Default: 100ms. Tune after measuring real p95 baseline in production.
# Valid range: 10–10000ms. Values outside this range are clamped at startup.
search:
  slow-query-threshold-ms: ${SEARCH_SLOW_QUERY_THRESHOLD_MS:100}
  # X-Search-Path response header — exposes text vs fallback execution path.
  # Enable in dev/staging for load testing and debugging.
  # Keep false in production: exposes internal system behavior to clients.
  # Authenticated users can also trigger per-request via X-Debug: true header.
  debug-headers-enabled: ${SEARCH_DEBUG_HEADERS:false}
  # Startup index verification retry config.
  # Exponential backoff: delays are initialDelay, initialDelay*multiplier, ...
  # Default: 3 retries, 2s initial, 2x multiplier → waits 2s + 4s = 6s max.
  index-verify:
    max-retries: ${SEARCH_INDEX_VERIFY_MAX_RETRIES:3}
    retry-initial-delay-ms: ${SEARCH_INDEX_VERIFY_INITIAL_DELAY_MS:2000}
    retry-backoff-multiplier: ${SEARCH_INDEX_VERIFY_BACKOFF_MULTIPLIER:2.0}
  # Adaptive fallback circuit breaker.
  # Uses hysteresis: disable threshold > enable threshold prevents oscillation.
  # Signal: p90 of a rolling window (not average — resistant to single outliers).
  # Circuit opens  when p90 > disable-threshold-ms (fallback suppressed).
  # Circuit closes when p90 < enable-threshold-ms  (fallback restored).
  fallback:
    disable-threshold-ms: ${SEARCH_FALLBACK_DISABLE_MS:200}
    enable-threshold-ms: ${SEARCH_FALLBACK_ENABLE_MS:120}
    window-size: ${SEARCH_FALLBACK_WINDOW_SIZE:20}

# Feature flags
SWAGGER_ENABLED: ${SWAGGER_ENABLED:false}
