name: ShipSpace CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: shipspace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "17"
  MVP_TESTS: "AdminControllerTest,AdminSecurityRouteTest,AuthControllerTest,AuthServiceRbacTest,BannedUserWriteFilterTest,EngagementControllerTest,EngagementServiceTest,FeedControllerTest,GitHubOAuthServiceTest,HealthControllerTest,JwtUtilTest,MongoIndexInitializerTest,MultibaseServiceTest,NotificationServiceTest,ProjectControllerTest,ShipControllerTest,SocialControllerTest,UserControllerTest,UserServiceTest"
  MONGO_SLICE_TESTS: "BehavioralSignalRepositoryTest,ContentScoreRepositoryTest,ScoreEventLogRepositoryTest,UserInterestProfileRepositoryTest,UserRepositoryTest"
  MVP_INTEGRATION_TESTS: "ShipCreationIntegrationTest"

jobs:
  # ── Stage 1: Build & Unit Tests ─────────────────────────────────────────────
  build:
    name: Build & Fast Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Compile backend
        run: mvn -B -DskipTests compile
        env:
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars!!

      - name: Run MVP backend regression tests
        run: mvn -B test -Dspring.profiles.active=test "-Dtest=${{ env.MVP_TESTS }}"
        env:
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars!!

      - name: Upload test results
        if: always() && vars.ENABLE_CI_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always() && vars.ENABLE_CI_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/site/jacoco/
          if-no-files-found: warn

  mongo-slice-tests:
    name: Embedded Mongo Slice Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run embedded Mongo-backed tests
        run: mvn -B test -Dspring.profiles.active=test "-Dtest=${{ env.MONGO_SLICE_TESTS }}" -DfailIfNoTests=false
        env:
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars!!

      - name: Upload embedded Mongo test results
        if: always() && vars.ENABLE_CI_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: embedded-mongo-test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  # ── Stage 2: Integration Tests (Testcontainers) ──────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: build
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run MVP integration tests
        run: mvn -B test -Dspring.profiles.active=test "-Dtest=${{ env.MVP_INTEGRATION_TESTS }}" -DfailIfNoTests=false
        env:
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars!!
          # Testcontainers pulls Docker images — Docker is available on ubuntu-latest
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload integration test results
        if: always() && vars.ENABLE_CI_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

  # ── Stage 3: Security Scanning ───────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [build, frontend]
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # SAST: CodeQL for Java
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build for CodeQL
        run: mvn -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Dependency vulnerability scan
      - name: OWASP Dependency Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.owasp-suppressions.xml || true
        continue-on-error: true  # Don't block on first run — review findings

      - name: Upload OWASP report
        if: always() && vars.ENABLE_CI_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          if-no-files-found: warn

      # Container image scan (runs after Docker build below — reuse image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: shipspace:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shipspace:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 4: Docker Build & Push ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [build, frontend, mongo-slice-tests, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → latest + sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            # develop branch → develop tag
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestation for supply chain security
          provenance: true
          sbom: true

  # ── Stage 5: Deploy to Staging ───────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: docker-build
    if: github.ref == 'refs/heads/develop' && vars.ENABLE_LEGACY_K8S_DEPLOY == 'true'
    environment:
      name: staging
      url: https://staging.shipspace.app

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging (rolling update)
        run: |
          echo "Deploying ${{ needs.docker-build.outputs.image-tag }} to staging"
          # Replace with your actual deployment command:
          # kubectl set image deployment/shipspace-backend \
          #   backend=${{ needs.docker-build.outputs.image-tag }} \
          #   --namespace=staging
          # kubectl rollout status deployment/shipspace-backend --namespace=staging --timeout=300s

      - name: Run smoke tests against staging
        run: |
          sleep 30  # Wait for deployment to stabilize
          curl -f https://staging.shipspace.app/api/actuator/health/readiness || exit 1
          curl -f https://staging.shipspace.app/api/health || exit 1

  # ── Stage 6: Deploy to Production (Blue-Green) ───────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: docker-build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_LEGACY_K8S_DEPLOY == 'true'
    environment:
      name: production
      url: https://shipspace.app
    # Requires manual approval via GitHub environment protection rules

    steps:
      - uses: actions/checkout@v4

      - name: Blue-green deploy to production
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          echo "Deploying $IMAGE to production (blue-green)"
          # Blue-green strategy:
          # 1. Deploy new version to "green" slot
          # 2. Run health checks on green
          # 3. Switch load balancer to green
          # 4. Keep blue running for 10 minutes (instant rollback)
          # 5. Terminate blue
          #
          # kubectl apply -f k8s/production/deployment-green.yml
          # kubectl set image deployment/shipspace-green backend=$IMAGE
          # kubectl rollout status deployment/shipspace-green --timeout=300s
          # kubectl apply -f k8s/production/service-switch-to-green.yml
          echo "Deployment complete"

      - name: Production smoke test
        run: |
          sleep 15
          curl -f https://shipspace.app/api/actuator/health/readiness || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment FAILED — triggering rollback"
          # kubectl apply -f k8s/production/service-switch-to-blue.yml
