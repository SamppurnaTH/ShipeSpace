global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "shipspace-backend"
    metrics_path: "/api/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]
    # Scrape every 15s — matches global interval
    scrape_interval: 15s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
