services:
  mongodb:
    image: mongo:7
    container_name: shipspace-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=shipspace
    # Single-node replica set — enables @Transactional support in Spring Data MongoDB
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - shipspace-network
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]});
          }
          db.adminCommand('ping').ok
        "
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shipspace-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - shipspace-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: shipspace-backend
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://mongodb:27017/shipspace?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3005}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3005/auth/callback}
      - MULTIBASE_API_URL=${MULTIBASE_API_URL:-http://localhost:5001}
      - MULTIBASE_API_KEY=${MULTIBASE_API_KEY:-}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shipspace-network
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8086/api
        - VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-CHANGE_ME}
        - VITE_GITHUB_REDIRECT_URI=http://localhost:3005/auth/callback
    container_name: shipspace-frontend
    ports:
      - "3005:3005"
    depends_on:
      - backend
    networks:
      - shipspace-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  shipspace-network:
    driver: bridge
