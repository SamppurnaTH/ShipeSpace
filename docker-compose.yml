

services:
  mongodb:
    image: mongo:latest
    container_name: shipspace-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=shipspace
    networks:
      - shipspace-network

  redis:
    image: redis:alpine
    container_name: shipspace-redis
    ports:
      - "6380:6379"
    networks:
      - shipspace-network

  backend:
    build: .
    container_name: shipspace-backend
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://mongodb:27017/shipspace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=http://localhost:3005,http://frontend:3000,http://localhost:8085
    depends_on:
      - mongodb
      - redis
    networks:
      - shipspace-network
    restart: unless-stopped

