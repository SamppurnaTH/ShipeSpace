services:
  mongodb:
    image: mongo:7
    container_name: shipspace-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=shipspace
    networks:
      - shipspace-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shipspace-redis
    ports:
      - "6380:6379"
    networks:
      - shipspace-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: shipspace-backend
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://mongodb:27017/shipspace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3005}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3005/auth/callback}
      - MULTIBASE_API_URL=${MULTIBASE_API_URL:-http://localhost:5001}
      - MULTIBASE_API_KEY=${MULTIBASE_API_KEY:-}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shipspace-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  shipspace-network:
    driver: bridge
