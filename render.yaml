services:
  - type: keyvalue
    name: krevo-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: krevo-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: krevo-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: ADMIN_GITHUB_IDS
        sync: false
      - key: MULTIBASE_API_URL
        sync: false
      - key: MULTIBASE_API_KEY
        sync: false
      - key: SWAGGER_ENABLED
        value: false
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: DEMO_MODE
        value: false
      - key: MANAGEMENT_TRACING_ENABLED
        value: false

  - type: web
    name: krevo-web
    runtime: static
    buildCommand: cd web && npm ci --legacy-peer-deps && npm run build
    staticPublishPath: web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://krevo-api.onrender.com/api
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
      - key: VITE_GITHUB_REDIRECT_URI
        sync: false
      - key: VITE_DEMO_MODE
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
