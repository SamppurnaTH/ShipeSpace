<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ship New Project - Mission Control</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e0513e", // Coral
                        "background-light": "#f8f6f6",
                        "background-dark": "#412653", // Deep Purple background
                        "steel-blue": "#3F567F", // Modal surface
                        "magenta-pill": "#D946EF",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-10 py-3 bg-background-dark/50 backdrop-blur-md">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-primary">
<span class="material-symbols-outlined text-3xl">rocket_launch</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">ShipSpace</h2>
</div>
<label class="flex flex-col min-w-40 !h-10 max-w-64">
<div class="flex w-full flex-1 items-stretch rounded-full h-full bg-white/10 overflow-hidden">
<div class="text-white/60 flex items-center justify-center pl-4">
<span class="material-symbols-outlined text-sm">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-transparent focus:ring-0 text-white placeholder:text-white/40 px-4 pl-2 text-sm" placeholder="Search the sector..." value=""/>
</div>
</label>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="flex items-center gap-9">
<a class="text-white/80 hover:text-white text-sm font-medium transition-colors" href="#">Fleet</a>
<a class="text-white/80 hover:text-white text-sm font-medium transition-colors" href="#">Missions</a>
<a class="text-white/80 hover:text-white text-sm font-medium transition-colors" href="#">Comm-Link</a>
</div>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-full h-10 px-6 bg-primary text-white text-sm font-bold tracking-[0.015em] hover:brightness-110 transition-all shadow-lg shadow-primary/20">
<span class="truncate">Launch Mission</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 ring-2 ring-primary/30" data-alt="User profile avatar showing a stylized astronaut" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBQJ_PrcH0vIJCtEJZd1_BzJa8LDxBlRlVwEIgewRvWZNhSrtjBEYlCmVVYRpQvzNgMQLgPdReUrUE-PRqSJfLGHEFe1bu7d4_pMXDwRfNGaO_cKBM9xWzTJH8ha8oYttI20yq-rrcwzId-4jIYinqXs67v32ZvZYryRk_IZbAlVijRyOmPDKniIZUmmR4qjYHH1cnsr7eH-VkCUk91eQJFf9KRHqy0oHW4p4VvLobFAYw-AH92uD7RCUKeVqsFtYpGMpwfmcT4Pb4");'>
</div>
</div>
</header>
<!-- Main Content Area (Background) -->
<main class="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
<!-- Abstract background elements to simulate space -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-magenta-pill/5 rounded-full blur-[150px]"></div>
<!-- Project Creation Modal -->
<div class="w-full max-w-2xl bg-steel-blue rounded-xl shadow-2xl border border-white/10 flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="p-8 pb-4 text-center">
<div class="inline-flex items-center justify-center size-14 rounded-full bg-white/10 mb-4 text-primary">
<span class="material-symbols-outlined text-3xl">add_task</span>
</div>
<h1 class="text-white tracking-tight text-3xl font-bold leading-tight">New Mission Assignment</h1>
<p class="text-white/70 text-base font-normal mt-2">Configure your project for deployment into the ShipSpace sector.</p>
</div>
<!-- Form Body -->
<form class="p-8 pt-4 space-y-6">
<!-- Project Name -->
<div class="flex flex-col gap-2">
<label class="text-white/90 text-sm font-semibold uppercase tracking-wider ml-1">Project Identifier</label>
<div class="relative">
<input class="form-input w-full rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/20 bg-white/5 h-14 placeholder:text-white/30 px-5 text-base transition-all" placeholder="e.g. Project Starbound"/>
</div>
</div>
<!-- URL Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="text-white/90 text-sm font-semibold uppercase tracking-wider ml-1">GitHub Manifest</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-white/40">terminal</span>
<input class="form-input w-full rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/20 bg-white/5 h-14 placeholder:text-white/30 pl-12 pr-5 text-base transition-all" placeholder="https://github.com/..."/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-white/90 text-sm font-semibold uppercase tracking-wider ml-1">Live Telemetry</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-white/40">language</span>
<input class="form-input w-full rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/20 bg-white/5 h-14 placeholder:text-white/30 pl-12 pr-5 text-base transition-all" placeholder="https://mission-live.com"/>
</div>
</div>
</div>
<!-- Tech Stack Tags -->
<div class="flex flex-col gap-2">
<label class="text-white/90 text-sm font-semibold uppercase tracking-wider ml-1">Tech Stack Manifest</label>
<div class="min-h-14 w-full rounded-xl border border-white/20 bg-white/5 p-3 flex flex-wrap gap-2 items-center">
<span class="bg-magenta-pill text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm">
                            React <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span>
</span>
<span class="bg-magenta-pill text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm">
                            Tailwind CSS <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span>
</span>
<span class="bg-magenta-pill text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1 shadow-sm">
                            TypeScript <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span>
</span>
<input class="bg-transparent border-none focus:ring-0 text-white placeholder:text-white/30 text-sm flex-1 min-w-[120px]" placeholder="Add tech..." type="text"/>
</div>
</div>
<!-- Project Pitch -->
<div class="flex flex-col gap-2">
<label class="text-white/90 text-sm font-semibold uppercase tracking-wider ml-1">Mission Briefing</label>
<textarea class="form-textarea w-full rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/20 bg-white/5 h-28 placeholder:text-white/30 p-4 text-base transition-all resize-none" placeholder="Briefly describe the mission goals..."></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 pt-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-14 rounded-full text-lg tracking-wide shadow-xl shadow-primary/30 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined">rocket_launch</span>
                        Launch Mission
                    </button>
<button class="w-full text-white/50 hover:text-white/80 font-medium text-sm transition-colors py-2 uppercase tracking-widest" type="button">
                        Scrub Mission
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer Status -->
<footer class="px-10 py-4 border-t border-white/10 bg-background-dark/80 backdrop-blur-md flex justify-between items-center text-[10px] uppercase tracking-widest text-white/40">
<div class="flex items-center gap-4">
<span class="flex items-center gap-1"><span class="size-1.5 rounded-full bg-green-500 animate-pulse"></span> Systems Nominal</span>
<span>Sector: 7G-Alpha</span>
</div>
<div class="flex items-center gap-4">
<span>© 2024 ShipSpace Command</span>
<span class="material-symbols-outlined text-xs">satellite_alt</span>
</div>
</footer>
</body></html>
